name = "sekolah-auth-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Mengaktifkan observability (logs & metrics)
[observability]
enabled = true

###############################################################################
# KV Namespace (Rate Limit)
###############################################################################

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4c00d9f800c24d8096eb133138478920"
preview_id = "4c00d9f800c24d8096eb133138478920"

###############################################################################
# Environment Variables
###############################################################################

[vars]

# Firebase
FIREBASE_PROJECT_ID = "studio-9960638705-245ad"

# Domain frontend yang boleh mengakses Worker
# Pisahkan dengan koma jika lebih dari satu.
ALLOWED_ORIGINS = "https://sekolahki.hairinannisa.workers.dev"

###############################################################################
# Secrets
###############################################################################

# Jangan simpan Service Account di file ini.
# Jalankan:
#
# wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
#
# lalu paste isi file JSON Firebase Service Account.
#
# Secret tersebut akan tersedia sebagai:
# env.FIREBASE_SERVICE_ACCOUNT_JSON
